<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Loader Centrado y Funcional</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #contenedor { max-width: 600px; margin: auto; }
        #resultado { margin-top: 20px; padding: 15px; border: 1px solid #ddd; background: #f9f9f9; }

        /* CSS del loader centrado y oculto por defecto */
        #loader-wrapper {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 30px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            /* Aquí está la clave para que inicie oculto */
            display: none;
        }
        .loader {
            border: 10px solid #f3f3f3;
            border-top: 10px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }
        #loader-wrapper p { font-family: sans-serif; margin-top: 20px; color: #333; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader-wrapper">
        <div class="loader"></div>
        <p>Cargando...datos</p>
    </div>

    <div id="contenedor">
        <h2>Consulta de Productos</h2>
        <select id="producto-selector">
            <option value="">-- Elige un producto --</option>
            <option value="laptop">Laptop</option>
            <option value="teclado">Teclado</option>
            <option value="monitor">Monitor</option>
        </select>
        <button id="btn-cargar">Cargar Detalles</button>
        <div id="resultado" style="display:none;"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
    $(document).ready(function() {
        $("#btn-cargar").on("click", function() {
            let productoId = $("#producto-selector").val();
            if (!productoId) { return; }

            $.ajax({
                url: 'productos.json', // Asume que tienes este archivo
                type: 'GET',
                dataType: 'json',
                beforeSend: function() {
                    // MOSTRAMOS EL LOADER
                    $('#loader-wrapper').fadeIn();
                },
                success: function(respuesta) {
                    // OCULTAMOS EL LOADER
                    $('#loader-wrapper').fadeOut();

                    let datos = respuesta[productoId];
                    let html = `<h3>${datos.nombre}</h3><p>Precio: $${datos.precio}</p>`;
                    $("#resultado").html(html).show();
                },
                error: function() {
                    // OCULTAMOS EL LOADER TAMBIÉN SI HAY ERROR
                    $('#loader-wrapper').fadeOut();
                    $("#resultado").html("<p>Error al cargar el producto.</p>").show();
                }
            });
        });
    });
    </script>
</body>
</html>
